<ion-content class="bg-slate-50 dark:bg-slate-900">
  <div class="px-6 py-6 flex flex-col min-h-screen">
    
    <!-- Header -->
    <div class="pb-6 sticky top-0 bg-slate-50/90 dark:bg-slate-900/90 backdrop-blur-md z-10 border-b border-slate-200/50 dark:border-slate-800/50">
      <h1 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Caisse / Encaissement</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Scannez le QR code de l'étudiant pour recevoir un paiement</p>
    </div>

    <!-- Boutique Selector Removed -->

    <!-- Error State -->
    <div *ngIf="errorMessage && !isLoading" class="mb-6 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl">
      <p class="text-sm font-bold text-red-700 dark:text-red-400">{{ errorMessage }}</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-12">
      <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
    </div>

    <!-- Main content: show if boutique selected -->
    <div *ngIf="!isLoading && selectedBoutiqueId" class="flex-1 flex flex-col items-center justify-center space-y-6">
      <div class="w-full">
        <ion-item class="premium-input" lines="none">
          <ion-icon name="cash-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input
            type="number"
            label="Montant à encaisser"
            labelPlacement="floating"
            [(ngModel)]="amount"
            placeholder="0.00">
          </ion-input>
        </ion-item>
      </div>

      <!-- Scanner UI -->
      <div *ngIf="isScanning" class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700 animate-fade-in-up mt-8 w-full max-w-sm">
        <h3 class="text-lg font-extrabold text-slate-900 dark:text-white text-center mb-4">Scanner le QR Code Étudiant</h3>
        
        <div *ngIf="scannedStudentId" class="mt-4 p-4 bg-indigo-50 dark:bg-indigo-900/30 rounded-xl border border-indigo-100 dark:border-indigo-800 mb-6">
           <p class="text-center text-slate-700 dark:text-slate-300 font-bold mb-3">Étudiant identifié.</p>
           <input type="password" inputmode="numeric" maxlength="6" [(ngModel)]="studentPin" class="w-full bg-white dark:bg-slate-800 p-3 rounded-lg text-center font-bold text-xl tracking-widest border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="PIN étudiant" />
           <button (click)="processPayment()" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-xl transition-colors">Valider le paiement</button>
           <button (click)="resetPayment()" class="w-full mt-2 text-slate-500 font-bold p-2 text-sm">Annuler</button>
        </div>

        <div class="relative rounded-2xl overflow-hidden bg-black aspect-square flex items-center justify-center" *ngIf="!scannedStudentId">
          <zxing-scanner 
            [enable]="isScanning" 
            (scanSuccess)="onCodeResult($event)" 
            (camerasFound)="onHasDevices($event)"
            (permissionResponse)="onHasPermission($event)">
          </zxing-scanner>
          <div class="absolute inset-0 border-4 border-indigo-500/50 rounded-2xl pointer-events-none"></div>
          <div *ngIf="!hasPermission && !hasDevices" class="absolute inset-0 flex items-center justify-center text-white">
            <p class="text-center px-4 font-bold text-sm">Accès à la caméra refusé ou introuvable.</p>
          </div>
        </div>

        <button (click)="stopScan()" class="mt-6 w-full py-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 font-bold rounded-2xl transition-colors">
          Annuler le Scan
        </button>
      </div>

      <!-- Generate Button -->
      <button *ngIf="!isScanning" (click)="startScan()" [disabled]="isLoading || !amount || amount <= 0 || !selectedBoutiqueId" class="w-full py-4 mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-xl shadow-indigo-600/30 transition-all flex items-center justify-center active:scale-95 disabled:opacity-50 disabled:active:scale-100">
        <span *ngIf="!isLoading">Scanner pour Encaisser</span>
        <div *ngIf="isLoading" class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </div>

    <!-- No boutique selected -->
    <div *ngIf="!isLoading && !selectedBoutiqueId" class="flex-1 flex flex-col items-center justify-center text-center">
      <ion-icon name="storefront-outline" class="text-5xl text-blue-500 mb-4"></ion-icon>
      <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">Aucune boutique active</h3>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Veuillez sélectionner une boutique dans votre profil.</p>
      <button routerLink="/main/profile" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95">
        Aller au Profil
      </button>
    </div>

  </div>
</ion-content>

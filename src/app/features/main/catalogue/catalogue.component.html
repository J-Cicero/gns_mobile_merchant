<ion-header>
  <ion-toolbar>
    <ion-title>Catalogue</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="flex flex-col min-h-screen px-6 py-12">
    <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-4">Gestion du Catalogue</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">Ajoutez, modifiez ou supprimez vos produits ici.</p>
    
    <!-- Placeholder for product listing -->
    <div class="mt-8">
      <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-4">Mes Produits</h2>
      <ion-list>
        <ion-item>
          <ion-label>Produit Exemple 1</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Produit Exemple 2</ion-label>
        </ion-item>
      </ion-list>
      <ion-button expand="block" class="mt-4">Ajouter un nouveau produit</ion-button>
    </div>
  </div>
</ion-content>

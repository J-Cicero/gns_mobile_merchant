<div class="ion-page">
<ion-content scroll-y="true" class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white">
  <div class="px-6 py-12">
    <!-- Header Section -->
    <div class="mb-8 text-center">
      <div class="w-16 h-16 mx-auto bg-indigo-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-indigo-500/30">
        <!-- Icon for Merchant -->
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight">Inscription Marchand</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">ÉTAPE {{ currentStep }} SUR 2</p>
    </div>

    <!-- Error Box -->
    <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl flex items-start">
      <svg class="w-5 h-5 text-red-500 mt-0.5 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-sm font-bold text-red-700 dark:text-red-400">{{ errorMessage }}</p>
    </div>

    <!-- Form Section -->
    <form (ngSubmit)="onSubmit()" class="space-y-6 flex-1">
      
      <!-- STEP 1: Personal Info -->
      <div *ngIf="currentStep === 1" class="space-y-5 fade-in">
        <h3 class="text-lg font-bold border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">Gérant / Propriétaire</h3>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Nom</label>
            <input type="text" [(ngModel)]="registrationData.lastName" name="lastName" required
              class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all placeholder-slate-400" 
              placeholder="Ex: DOSSO">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Prénom</label>
            <input type="text" [(ngModel)]="registrationData.firstName" name="firstName" required
              class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all placeholder-slate-400" 
              placeholder="Ex: Marc">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Email</label>
          <input type="email" [(ngModel)]="registrationData.email" name="email" required
            class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all placeholder-slate-400" 
            placeholder="marchand@exemple.com">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Téléphone</label>
          <input type="tel" [(ngModel)]="registrationData.phoneNumber" name="phoneNumber" required
            class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all placeholder-slate-400" 
            placeholder="+228 90 00 00 00">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Date de Naissance</label>
          <input type="date" [(ngModel)]="registrationData.birthDate" name="birthDate" required
            class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Lieu de Naissance</label>
          <input type="text" [(ngModel)]="registrationData.birthPlace" name="birthPlace" required
            class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all placeholder-slate-400" 
            placeholder="Ex: Lomé">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Mot de passe</label>
          <input type="password" [(ngModel)]="registrationData.password" name="password" required
            class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all placeholder-slate-400" 
            placeholder="••••••••">
        </div>
      </div>

      <!-- STEP 2: Bank Info & RIB -->
      <div *ngIf="currentStep === 2" class="space-y-5 fade-in">
        <h3 class="text-lg font-bold border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">Informations Bancaires</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Nécessaire pour recevoir vos paiements directement sur votre compte.</p>
        
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Banque</label>
          <select [(ngModel)]="registrationData.bankTrackingId" name="bankTrackingId" required
            class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="" disabled selected>Sélectionner une banque</option>
            <option *ngFor="let banque of banques" [value]="banque.trackingId">{{ banque.name }}</option>
          </select>
        </div>

        <div *ngIf="registrationData.bankTrackingId">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Numéro de Compte</label>
          <input type="text" [(ngModel)]="registrationData.accountNumber" name="accountNumber" required
            class="w-full px-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all placeholder-slate-400" 
            placeholder="Ex: 0123456789">
        </div>

        <div *ngIf="registrationData.bankTrackingId">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Relevé d'Identité Bancaire (RIB)</label>
          <input type="file" (change)="onRibSelected($event)" accept=".pdf,image/*" required
            class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-50 dark:file:bg-indigo-900/30 file:text-indigo-600 dark:file:text-indigo-400 hover:file:bg-indigo-100">
          <p class="text-xs text-slate-400 mt-2 ml-1">Format accepté: PDF ou Image (JPG/PNG)</p>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="pt-6 flex space-x-3 mt-auto">
        <button *ngIf="currentStep === 2" type="button" (click)="prevStep()" 
          class="w-1/3 py-4 px-4 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 font-bold rounded-xl border border-slate-200 dark:border-slate-700 transition-all active:scale-[0.98]">
          Retour
        </button>
        
        <button *ngIf="currentStep === 1" type="button" (click)="nextStep()" 
          class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-[0.98]">
          Continuer
        </button>

        <button *ngIf="currentStep === 2" type="submit" (click)="nextStep()" [disabled]="isSubmitting" 
          class="flex-1 py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-[0.98] disabled:opacity-70 flex justify-center items-center">
          <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span *ngIf="!isSubmitting">Créer mon compte</span>
          <span *ngIf="isSubmitting">Création...</span>
        </button>
      </div>

    </form>

    <div class="mt-8 text-center" *ngIf="currentStep === 1">
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Déjà partenaire ? 
        <a routerLink="/auth/login" routerDirection="back" class="font-bold text-indigo-600 dark:text-indigo-400 hover:underline" style="cursor: pointer;">Connectez-vous</a>
      </p>
    </div>

  </div>
</ion-content>
</div>

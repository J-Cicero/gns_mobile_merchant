<ion-content class="bg-slate-50 dark:bg-slate-900">
  <div class="min-h-screen flex flex-col justify-center items-center px-6 py-12">

    <!-- Branding -->
    <div class="w-full max-w-sm mb-10 text-center animate-fade-in-up">
      <div class="mx-auto mb-6 flex justify-center">
        <img src="assets/studcash-logo.png" alt="studCASH Logo" style="height: 80px; width: auto; object-fit: contain;">
      </div>
      <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">Gérez votre commerce avec simplicité</p>
    </div>

    <!-- Form Section -->
    <div
      class="w-full max-w-sm bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-700 animate-fade-in-up"
      style="animation-delay: 100ms;">

      <div class="space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Adresse Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
              <ion-icon name="mail-outline" class="text-xl"></ion-icon>
            </div>
            <input type="email" [(ngModel)]="credentials.email" placeholder="marchand@exemple.com"
              class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all font-medium">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
              <ion-icon name="lock-closed-outline" class="text-xl"></ion-icon>
            </div>
            <input type="password" [(ngModel)]="credentials.password" placeholder="••••••••"
              class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all font-medium">
          </div>
        </div>

        <div class="flex justify-end">
          <a
            class="text-sm font-bold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 transition-colors cursor-pointer">Mot
            de passe oublié ?</a>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage"
        class="mt-6 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl flex items-start">
        <ion-icon name="alert-circle" class="text-red-600 dark:text-red-400 text-xl mr-2 mt-0.5"></ion-icon>
        <span class="text-sm font-bold text-red-700 dark:text-red-400">{{ errorMessage }}</span>
      </div>

      <!-- Submit -->
      <button (click)="onLogin()" [disabled]="isLoading"
        class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all active:scale-95 flex items-center justify-center disabled:opacity-70 disabled:active:scale-100">
        <ion-spinner *ngIf="isLoading" name="crescent" class="mr-2 w-5 h-5"></ion-spinner>
        <span *ngIf="!isLoading">Se Connecter</span>
        <ion-icon *ngIf="!isLoading" name="arrow-forward" class="ml-2 text-xl"></ion-icon>
      </button>

    </div>

    <!-- Register Link -->
    <div class="mt-8 text-center animate-fade-in-up" style="animation-delay: 200ms;">
      <p class="text-slate-500 dark:text-slate-400 font-medium">
        Pas encore de compte ?
        <a (click)="goToRegister()"
          class="font-extrabold text-indigo-600 dark:text-indigo-400 cursor-pointer hover:underline">Créer un compte</a>
      </p>
    </div>

  </div>
</ion-content>
